<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Beartil Rajan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">
        <div class="sidebar">
            <img src="odin-lined.png" alt="odin" class="image1">
            <img src="halie-west-25xggax4bSA-unsplash.jpg" alt="odin" class="image">
        </div>
        <div class="container">
            <div class="upper">
                <p class="topText">
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up now to get started.
                </p>
                <p class="topText_2">
                    You know you want to.
                </p>
            </div>
            <div class="middle">
                <p class="doThis">All right let's do this </p>
                <div class="midTop">
                    <div class="midTopLeft">
                        <label for="name" class="firstName">First Name :</label>
                        <input type="text" name="name" id="name" placeholder="Enter your first name">

                    </div>
                    <div class="midTopRight">
                        <label for="name" class="SecondName">Last Name :</label>
                        <input type="text" name="name" id="name" placeholder="Enter your Last name">
                    </div>
                </div>
                <div class="midDetails">
                    <div class="Emails">
                        <label for="email" class="EmailAddress">Email Address :</label>
                        <input type="email" name="email" id="email" placeholder="Enter Email address">
                    </div>
                    <div class="number">
                        <label for="number" class="PhoneNumber">Phone Number :</label>
                        <input type="number" name="number" id="number" placeholder="Enter your phone number">
                    </div>
                </div>
                <div>
                    <form action="main.js" class="bottomDetails">
                        <div class="PasswordBox">
                            <label for="Password" class="password">Password :</label>
                            <input type="password" name="password" pattern="[A-Z]" id="password" placeholder="Enter Password" required>
                        </div>
                        <div class="confirmPasswordBox">
                            <label for="ConfirmPassword" class="confirmpassword">Confirm Password :</label>
                            <input type="password" name="ConfirmPassword" id="ConfirmPassword"
                                placeholder="Confirm password" required onclick="SamePassword">
                        </div>
                    </form>
                </div>
            </div>

            <div class="end">
                <button type="button" class="button">Create Account</button>
                <p class="login">Already have an account ? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>

</html>
